name: Deploy GitHub Pages

on:
  push:
    branches:
      - cursor/job-board-resume-generator-7a21
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and export static site
        env:
          SITE_BASE: /codegenrator
          STATIC_EXPORT: "True"
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py seed_jobs
          python manage.py export_static --base /codegenrator
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
