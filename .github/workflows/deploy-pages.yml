name: Deploy GitHub Pages

on:
  push:
    branches:
      - cursor/job-board-resume-generator-7a21
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and export static site
        env:
          SITE_BASE: /codegenrator
          STATIC_EXPORT: "True"
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py seed_jobs
          python manage.py export_static --base /codegenrator
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
