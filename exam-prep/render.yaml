services:
  reviseready:
    type: web
    runtime: docker
    dockerfilePath: exam-prep/Dockerfile
    dockerContext: exam-prep
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: OPENAI_API_KEY
        sync: false
